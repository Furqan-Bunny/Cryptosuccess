name: Scheduler

# Vercel Hobby only allows daily crons, so vercel.json runs these once a day.
# This workflow calls the frequent jobs hourly as well:
#   /api/engine/tick       - fills stop-loss / take-profit / trailing / limit orders, liquidates futures
#   /api/signals/evaluate  - scores signals older than 24h (feeds the on-chain track record)
#   /api/telegram/followups - tells Telegram users how their scored calls turned out
#                            (runs after evaluate; a 503 "not configured" is only a warning)
# and then checks /api/ops/status?strict=1, which answers 503 when any cron
# (hourly or daily) is stale or failing — so a silently broken scheduler turns
# this workflow red and GitHub emails the repo owner.
#
# For near-real-time stop-losses, point an external scheduler (e.g. cron-job.org)
# at /api/engine/tick every 1-2 minutes with the same Bearer token.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL      e.g. https://your-app.vercel.app (no trailing path)
#   CRON_SECRET  the same value as the deployment's CRON_SECRET env var
# Missing secrets FAIL the run on purpose: a scheduler that quietly does nothing
# is how stop-losses and signal scoring stop without anyone noticing.
#
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity — re-enable it under the Actions tab if that happens.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check required secrets
        id: secrets
        run: |
          missing=0
          if [ -z "$APP_URL" ]; then
            echo "::error title=Scheduler misconfigured::Repository secret APP_URL is not set."
            missing=1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=Scheduler misconfigured::Repository secret CRON_SECRET is not set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Engine tick and signal evaluation are NOT running. Set the secrets above."
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *)
              echo "::error title=Scheduler misconfigured::APP_URL must start with https://"
              exit 1
              ;;
          esac

      - name: Call scheduled endpoints
        run: |
          base="${APP_URL%/}"
          failed=0
          for path in /api/engine/tick /api/signals/evaluate; do
            echo "POST $path"
            # Only the response status and body are printed; the token is read
            # from the environment and never echoed (GitHub also masks secrets).
            if ! curl --silent --show-error --fail-with-body \
                --retry 2 --retry-delay 10 --retry-all-errors \
                --max-time 90 \
                -X POST \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                -w '\nHTTP %{http_code}\n' \
                "${base}${path}"; then
              echo "::error title=Cron call failed::POST ${path} failed"
              failed=1
            fi
            echo
          done
          exit "$failed"

      - name: Call Telegram follow-ups
        # Still runs when the tick/evaluate step failed, but never without secrets.
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
        run: |
          base="${APP_URL%/}"
          echo "POST /api/telegram/followups"
          code=$(curl --silent --show-error               --retry 2 --retry-delay 10 --retry-all-errors               --max-time 90               -o followups.json -w '%{http_code}'               -X POST               -H "Authorization: Bearer ${CRON_SECRET}"               "${base}/api/telegram/followups") || code="000"
          echo "HTTP $code"
          [ -s followups.json ] && cat followups.json && echo
          reason=$(jq -r '.reason // empty' followups.json 2>/dev/null || true)
          rm -f followups.json
          if [ "$code" = "200" ]; then
            exit 0
          fi
          if [ "$code" = "503" ] && [ "$reason" = "not_configured" ]; then
            echo "::warning title=Telegram bot not configured::Follow-ups skipped (TELEGRAM_BOT_TOKEN / Supabase not set on the deployment)."
            exit 0
          fi
          echo "::error title=Cron call failed::POST /api/telegram/followups failed (HTTP $code)"
          exit 1

  health:
    # Runs even when the tick job failed, so one red run reports everything.
    needs: tick
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check cron health
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error title=Scheduler misconfigured::APP_URL / CRON_SECRET secrets are not set."
            exit 1
          fi
          echo "GET /api/ops/status?strict=1"
          # The full report stays server-side: Actions logs can be public, so only
          # the HTTP status and per-job health states are printed here.
          # No --fail here: a 503 still carries the per-job report we summarise.
          code=$(curl --silent --show-error \
              --retry 1 --retry-delay 10 \
              --max-time 30 \
              -o status.json -w '%{http_code}' \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL%/}/api/ops/status?strict=1") || code="000"
          echo "HTTP $code"
          if [ -s status.json ]; then
            jq -r '(.crons // [])[] | "\(.name): \(.status)\(if .degraded then " (needs attention)" else "" end)"' status.json 2>/dev/null \
              || echo "(response was not JSON)"
          fi
          rm -f status.json
          if [ "$code" != "200" ]; then
            echo "::error title=Cron health degraded::/api/ops/status returned HTTP $code - one or more scheduled jobs are stale or failing (details: GET /api/ops/status with the cron token)."
            exit 1
          fi
