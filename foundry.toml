# Foundry config for the TrackRecordAnchor contract (dev-only; not part of the
# Next.js runtime). Install Foundry: https://book.getfoundry.sh/getting-started/installation
[profile.default]
src = "contracts"
out = "contracts/out"
test = "contracts/test"
script = "contracts/script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
libs = ["node_modules", "lib"]
